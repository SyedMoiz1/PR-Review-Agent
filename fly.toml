# fly launch --no-deploy  (pick your own app name), then:
# fly secrets set GITHUB_WEBHOOK_SECRET=... GITHUB_TOKEN=... OPENAI_API_KEY=... ANTHROPIC_API_KEY=... QDRANT_URL=... QDRANT_API_KEY=...
# fly deploy
app = "pr-review-agent"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  method = "GET"
  path = "/health"
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
